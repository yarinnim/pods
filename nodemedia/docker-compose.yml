version: "3.9"

x-default-opts: &default-opts
  logging:
    options:
      max-size: "100m"

networks:
  backend:
    driver: overlay

services:
  nodemedia:
    <<: *default-opts
    image: "${NODEMEDIA_IMAGE}"
    hostname: nodemedia
    networks:
      - backend

    volumes:
      - ./nodemedia.config.js:/node-media-server/config.js

    ports:
      - ${NODEMEDIA_RTMP_PORT}:1935
      - ${NODEMEDIA_HTTP_PORT}:8000

    deploy:
      replicas: 1
      restart_policy:
        condition: any
