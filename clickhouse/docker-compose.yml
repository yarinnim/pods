networks:
  clickhouse:
    driver: overlay
  backend:
    driver: overlay

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "${HOST_HTTP_PORT}:8123"
      - "${HOST_NATIVE_PORT}:9000"
      - "${HOST_SECURE_NATIVE_PORT}:9440"
    volumes:
      - ${DATA_PATH}:/var/lib/clickhouse
      - ${LOG_PATH}:/var/log/clickhouse-server
    environment:
      - CLICKHOUSE_USER=${ADMIN_USERNAME}
      - CLICKHOUSE_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - backend
      - clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: always
