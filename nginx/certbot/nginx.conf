server {
  listen 80;
  server_name registry.yourdomain.com;

  # Redirect all plain HTTP traffic to secure HTTPS
  location / {
    return 302 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name registry.yourdomain.com;
  http2 on;

  # SSL Certificates managed by Certbot / Let's Encrypt
  ssl_certificate /etc/nginx/certs/live/registry.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/registry.yourdomain.com/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # CRITICAL: Bypasses the 100MB body limitation for massive Docker layers
  client_max_body_size 0;
  chunked_transfer_encoding on;

  location / {
    # 'harbor-portal' is the internal container service name generated by Harbor
    proxy_pass http://harbor-portal:80;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # CRITICAL: Forces Harbor to know the outer connection is secure HTTPS
    proxy_set_header X-Forwarded-Proto https;

    proxy_buffering off;
    proxy_request_buffering off;
  }
}
