map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_origin $cors_allow_origin {
  default $http_origin;
  ''      '*';
}

upstream ejabberd_http {
  server common_ejabberd:5280;
}

# TLS listener currently hosts /websocket and /upload.
# Because websocket requires security
upstream ejabberd_https {
  server common_ejabberd:5443;
}

server {
  listen 80;
  listen [::]:80;
  server_name ejabberd.mydomain.com;

  location = /ws {
    proxy_pass https://ejabberd_https/websocket;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location ^~ /upload {
    proxy_pass https://ejabberd_https;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location ~ ^/(bosh|http-bind|api|admin) {
    proxy_pass http://ejabberd_http;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
