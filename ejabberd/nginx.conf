map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_origin $cors_allow_origin {
  default $http_origin;
  ''      '*';
}

upstream ejabberd_http {
  server common_ejabberd:5280;
}

# TLS listener currently hosts /websocket and /upload.
# Because websocket requires security
upstream ejabberd_https {
  server common_ejabberd:5443;
}

server {
  listen 80;
  listen [::]:80;
  server_name ejabberd.localhost.com;

  location = /ws {
    proxy_pass https://ejabberd_https/websocket;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # proxy_set_header Host 172.18.0.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location ^~ /upload {
    # Preflight only — do not also add CORS on proxied PUT/GET responses,
    # or the browser sees Multiple Allow-Origin (nginx + ejabberd).
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_allow_origin always;
      add_header Access-Control-Allow-Methods "GET,HEAD,PUT,OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    proxy_pass https://ejabberd_https;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Strip ejabberd CORS, then emit a single Allow-Origin.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Methods "GET,HEAD,PUT,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Vary Origin always;
  }

  location ~ ^/(bosh|http-bind|api|admin) {
    proxy_pass http://ejabberd_http;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $host;
    # proxy_set_header Host 172.18.0.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
