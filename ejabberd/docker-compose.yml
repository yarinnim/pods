version: "3.9"

x-default-opts: &default-opts
  logging:
    options:
      max-size: "100m"

networks:
  ejabberd:
    driver: overlay
  backend:
    driver: overlay

services:
  ejabberd:
    <<: *default-opts
    image: ${EJABBERD_IMAGE}
   
    environment:
      - EJABBERD_MACRO_HOST=${EJABBERD_DOMAIN}
      - EJABBERD_MACRO_ADMIN=${EJABBERD_ADMIN_USER}@${EJABBERD_DOMAIN}
      - REGISTER_ADMIN_PASSWORD=${EJABBERD_ADMIN_PASSWORD}

    ports:
      - "${EJABBERD_CLIENT_TO_SERVER_PORT}:5222"
      - "${EJABBERD_SERVER_TO_SERVER_PORT}:5269"
      - "${EJABBERD_HTTP_PORT}:5280"
      - "${EJABBERD_HTTPS_PORT}:5443"

    volumes:
      - ${EJABBERD_CONF_PATH}:/home/ejabberd/conf
      - ${EJABBERD_DATABASE_PATH}:/home/ejabberd/database
      - ${EJABBERD_LOGS_PATH}:/home/ejabberd/logs
      - ${EJABBERD_UPLOAD_PATH}:/home/ejabberd/upload

    networks:
      - ejabberd
      - backend
