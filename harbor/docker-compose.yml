services:
  log:
    image: goharbor/harbor-log:v${HARBOR_VERSION}
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - ${HARBOR_LOG_PATH}:/var/log/docker/:z
      - ./common/config/log/logrotate.conf:/etc/logrotate.d/logrotate.conf
      - ./common/config/log/rsyslog_docker.conf:/etc/rsyslog.d/rsyslog_docker.conf
    ports:
      # - 127.0.0.1:1514:10514
      - 1514:10514
    networks:
      - harbor
  registry:
    image: goharbor/registry-photon:v${HARBOR_VERSION}
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ${HARBOR_DATA_PATH}/registry:/storage:z
      - ./common/config/registry/:/etc/registry/:z
      - ${HARBOR_DATA_PATH}/secret/registry/root.crt:/etc/registry/root.crt:z
      - ./common/config/shared/trust-certificates:/harbor_cust_cert:z
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "registry"
  registryctl:
    image: goharbor/harbor-registryctl:v${HARBOR_VERSION}
    env_file:
      - ./common/config/registryctl/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ${HARBOR_DATA_PATH}/registry:/storage:z
      - ./common/config/registry/:/etc/registry/:z
      - ./common/config/registryctl/config.yml:/etc/registryctl/config.yml:z
      - ./common/config/shared/trust-certificates:/harbor_cust_cert:z
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "registryctl"
  core:
    image: goharbor/harbor-core:v${HARBOR_VERSION}
    env_file:
      - ./common/config/core/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - ${HARBOR_DATA_PATH}/ca_download/:/etc/core/ca/:z
      - ${HARBOR_DATA_PATH}:/data/:z
      - ./common/config/core/certificates/:/etc/core/certificates/:z
      - ./common/config/core/app.conf:/etc/core/app.conf
      - ${HARBOR_DATA_PATH}/secret/core/private_key.pem:/etc/core/private_key.pem
      - ${HARBOR_DATA_PATH}/secret/keys/secretkey:/etc/core/key
      - ./common/config/shared/trust-certificates:/harbor_cust_cert
    networks:
      - harbor
      - common_backend
    depends_on:
      - log
      - registry
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "core"
  portal:
    image: goharbor/harbor-portal:v${HARBOR_VERSION}
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./common/config/portal/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "portal"

  jobservice:
    image: goharbor/harbor-jobservice:v${HARBOR_VERSION}
    env_file:
      - ./common/config/jobservice/env
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ${HARBOR_DATA_PATH}/job_logs:/var/log/jobs:z
      - ./common/config/jobservice/config.yml:/etc/jobservice/config.yml
      - ./common/config/shared/trust-certificates:/harbor_cust_cert
    networks:
      - harbor
      - common_backend
    depends_on:
      - core
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "jobservice"
  proxy:
    image: goharbor/nginx-photon:v${HARBOR_VERSION}
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - ./common/config/nginx:/etc/nginx:z
      - ./common/config/shared/trust-certificates:/harbor_cust_cert
    networks:
      - harbor
    ports:
      - 8082:8080
    depends_on:
      - registry
      - core
      - portal
      - log
    logging:
      driver: "syslog"
      options:
        syslog-address: "tcp://localhost:1514"
        tag: "proxy"
networks:
  harbor:
    external: false
  common_backend:
    external: true
