services:
  agent:
    image: portainer/agent:lts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent
      - common_backend
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ee:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify --trusted-origins portainer-test.qubehub.work
    ports:
      - ${PORTAINER_HTTPS_PORT}:9443
      - ${PORTAINER_HTTP_PORT}:9000
      - ${PORTAINER_API_PORT}:8000
    volumes:
      - ${PORTAINER_DATA}:/data
    networks:
      - agent
      - common_backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  agent:
    driver: overlay
    attachable: true
  common_backend:
    external: true
