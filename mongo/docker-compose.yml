version: "3.9"

x-default-opts: &default-opts
  logging:
    options:
      max-size: "100m"

volumes:
  alertmanager: {}
  db-data:
    driver: local
  influx-data:
    driver: local

networks:
  backend:
    driver: overlay

services:
  mongo:
    image: mongo
    env_file: .env
    environment:
      # Kernel 6.19–7.0.13 crashes TCMalloc per-CPU caches (SERVER-121912).
      # Let glibc own rseq so mongod falls back to per-thread caches and starts.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - ${MONGO_PATH}/db:/data/db
      - ${MONGO_PATH}/configdb:/data/configdb
    networks:
      - backend
