map $http_upgrade $browserless_connection_upgrade {
  default upgrade;
  ''      close;
}

upstream browserless_backend {
  server common_browserless:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name browserless.localhost.com;

  client_max_body_size 100M;

  proxy_connect_timeout 60s;
  proxy_send_timeout 3600s;
  proxy_read_timeout 3600s;

  location / {
    proxy_pass http://browserless_backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $browserless_connection_upgrade;

    proxy_buffering off;
  }
}
