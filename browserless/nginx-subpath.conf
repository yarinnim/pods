# Paste inside the apps.localhost.com server. The upstream and websocket map
# come from nginx.conf, which must be loaded as well.
#
#   https://apps.localhost.com/browserless/

location = /browserless {
  rewrite ^ / break;
  proxy_pass http://browserless_backend;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $browserless_connection_upgrade;

  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

location /browserless/ {
  rewrite ^/browserless/(.*)$ /$1 break;
  proxy_pass http://browserless_backend;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $browserless_connection_upgrade;

  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
