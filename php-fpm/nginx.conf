# Swarm DNS name for this service: {stack}_{service}
# APP_NAME=@experimental/php-fpm and APP_ENV=test -> experimental-test_php-fpm
upstream php_fpm {
  server php-projects_php-fpm:9000;
}

server {
  listen 80;
  server_name php-fpm.loc www.php-fpm.loc;

  # Files nginx serves. Each Laravel app is mounted at its own directory.
  root /var/www/php-fpm/public;
  index index.php;
  charset utf-8;

  client_max_body_size 100M;

  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  error_page 404 /index.php;

  location ~ ^/index\.php(/|$) {
    fastcgi_pass php_fpm;
    # Path inside the php-fpm container, where this app is mounted at /var/www.
    fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT /var/www/public;
    include fastcgi_params;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
  }

  location ~ \.php$ {
    return 404;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}
