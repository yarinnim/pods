; Applied on top of php.ini-production.
; Restart php-fpm and the queue worker after a deploy. OPcache will not
; notice changed files while validate_timestamps is off.

[PHP]
; Match client_max_body_size in nginx.conf.
upload_max_filesize = 100M
post_max_size = 100M

; Log to stderr. Do not return errors to the client.
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Debug mode. This file is mounted over the image copy. Edit it, then
; restart php-fpm and the queue worker. Use these values to show errors
; and reload changed scripts:
; display_errors = On
; display_startup_errors = On
; html_errors = On
; error_reporting = E_ALL
; opcache.validate_timestamps = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
