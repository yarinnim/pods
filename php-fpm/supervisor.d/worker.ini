[program:worker]
command=/usr/local/bin/worker-entrypoint
directory=/var/www
user=www-data
autostart=true
autorestart=true
priority=20
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
