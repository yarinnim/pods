map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name aistor.mydomain.com;

  # Allow large file uploads
  client_max_body_size 0;
  # Disable buffering for large streams
  proxy_buffering off;
  proxy_request_buffering off;

  # MinIO API (S3)
  # Most SDKs and tools will use the root of this subdomain
  location / {
    # For socket behind proxy
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host; # For Server Docker
    # proxy_set_header Host 172.17.0.1; # For Local Docker

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 300;
    chunked_transfer_encoding off;

    # Point to your MinIO API port (9000)
    proxy_pass http://common_aistor:9001;
  }

  location /buckets/ {
    # Standard proxy headers
    proxy_set_header Host $http_host;
    # proxy_set_header Host 172.17.0.1; # For Local Docker

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fix for MinIO's chunked uploading
    proxy_connect_timeout 300;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;

    # The actual backend address
    # Use 'rewrite' if you want /public/image.jpg to map to bucket-name/image.jpg
    # Or just proxy_pass if 'public' is the name of your bucket
    proxy_pass http://common_aistor:9000/;
  }
}
