networks:
  aistor:
    driver: overlay
  backend:
    driver: overlay

services:
  aistor:
    image: quay.io/minio/aistor/minio:latest
    ports:
      - "${AISTOR_API_PORT}:9000"      # API Port
      - "${AISTOR_CONSOLE_PORT}:9001"      # Console UI Port

    environment:
      MINIO_ROOT_USER: "${AISTOR_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${AISTOR_ROOT_PASSWORD}"
      MINIO_BROWSER_REDIRECT_URL: "${AISTOR_BROWSER_REDIRECT_URL}"
    command: server /data --license /minio.license
    volumes:
      - ${AISTOR_DATA_PATH}:/data
      - ${AISTOR_LICENSE_FILE}:/minio.license
      - ./certs:/etc/minio/certs
    networks:
      - backend
      - aistor

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
