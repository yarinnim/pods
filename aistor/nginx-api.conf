map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name aistor-api.mydomain.com;

  # Allow large file uploads
  client_max_body_size 0;
  # Disable buffering for large streams
  proxy_buffering off;
  proxy_request_buffering off;

  location / {
    # Standard proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fix for MinIO's chunked uploading
    proxy_connect_timeout 300;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    chunked_transfer_encoding off;

    # The actual backend address
    # Use 'rewrite' if you want /public/image.jpg to map to bucket-name/image.jpg
    # Or just proxy_pass if 'public' is the name of your bucket
    proxy_pass http://common_aistor:9000/;
  }
}
