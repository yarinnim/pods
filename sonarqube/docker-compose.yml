version: "3.9"

x-default-opts: &default-opts
  logging:
    options:
      max-size: "100m"

networks:
  sonarnet:
    driver: overlay
  backend:
    driver: overlay

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_temp:

services:
  sonarqube:
    <<: *default-opts
    image: ${SONARQUBE_IMAGE}
    
    networks:
      - sonarnet
      - backend
    
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://${SONAR_DB_HOST}:${SONAR_DB_PORT}/${SONAR_DB_NAME}
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
    
    ports:
      - "${SONARQUBE_PORT}:9000"

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_temp:/opt/sonarqube/temp

    deploy:
      restart_policy:
        condition: any

